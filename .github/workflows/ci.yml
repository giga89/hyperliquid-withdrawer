name: CI Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilation & Syntax Check
        run: |
          python -m py_compile core.py cli.py web_app.py tests/*.py

      - name: Run Subprocess Smoke Tests
        run: |
          python -c "import core; import cli; import web_app; print('Imports verified successfully')"

      - name: Run Test Suite (pytest)
        run: |
          pytest -v
